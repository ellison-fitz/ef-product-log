<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: site.title }} · {{ site.title }}</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap");

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f9f7;
    --surface: #ffffff;
    --border: #e5e5e0;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #1a9b7b;
    --accent-light: #e6f7f3;
    --accent-dark: #147a62;
    --warn: #d97706;
    --warn-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --radius: 10px;
    --font: "Inter", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
  }

  /* ─── NAV ─── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .nav-badge {
    background: var(--accent-light);
    color: var(--accent-dark);
    border: 1px solid #b2e5d9;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ─── LAYOUT ─── */
  .page { max-width: 780px; margin: 0 auto; padding: 48px 24px 80px; }

  /* ─── HERO ─── */
  .hero { margin-bottom: 48px; padding-bottom: 40px; border-bottom: 1px solid var(--border); }
  .hero-eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 12px; }
  .hero p { color: var(--muted); max-width: 560px; }

  /* ─── ALERT BOX ─── */
  .alert {
    display: flex;
    gap: 12px;
    padding: 14px 18px;
    border-radius: var(--radius);
    margin-bottom: 40px;
    font-size: 14px;
    line-height: 1.5;
  }
  .alert.green { background: var(--accent-light); border: 1px solid #b2e5d9; color: var(--accent-dark); }
  .alert.yellow { background: var(--warn-light); border: 1px solid #fde68a; color: #92400e; }
  .alert.red { background: var(--danger-light); border: 1px solid #fecaca; color: #991b1b; }
  .alert-icon { font-size: 18px; flex-shrink: 0; line-height: 1.4; }
  .alert strong { font-weight: 600; }

  /* ─── SECTION ─── */
  .section { margin-bottom: 48px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-icon { font-size: 20px; }
  .section-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .section-badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--accent-light);
    color: var(--accent-dark);
    border: 1px solid #b2e5d9;
  }
  .section-badge.updated { background: var(--warn-light); color: #92400e; border-color: #fde68a; }

  /* ─── CARDS / SUBSECTIONS ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 12px;
  }
  .card h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h3 .tag {
    font-size: 11px;
    font-weight: 500;
    background: #f0f0ee;
    color: var(--muted);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .card p, .card li { font-size: 14px; color: #3a3a3a; line-height: 1.6; }
  .card ul, .card ol { padding-left: 18px; margin-top: 6px; }
  .card li { margin-bottom: 4px; }

  /* ─── PILLS / RULES ─── */
  .rule-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 14px;
  }
  .rule-row:last-child { border-bottom: none; padding-bottom: 0; }
  .rule-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  /* ─── TABLE ─── */
  .sop-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  .sop-table th {
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 8px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .sop-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0ee; vertical-align: top; }
  .sop-table tr:last-child td { border-bottom: none; }
  .anger-low { color: #047857; font-weight: 600; }
  .anger-mid { color: var(--warn); font-weight: 600; }
  .anger-high { color: var(--danger); font-weight: 600; }

  /* ─── TEMPLATE BLOCKS ─── */
  .template-block {
    background: #f4f4f2;
    border: 1px solid #e2e2de;
    border-radius: 8px;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    color: #2a2a2a;
    margin-top: 10px;
  }
  .template-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  /* ─── CHECKLIST ─── */
  .checklist { list-style: none; padding: 0; }
  .checklist li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    font-size: 14px;
    border-bottom: 1px solid #f0f0ee;
    line-height: 1.5;
  }
  .checklist li:last-child { border-bottom: none; }
  .check { flex-shrink: 0; width: 18px; height: 18px; border: 2px solid var(--accent); border-radius: 4px; margin-top: 2px; }

  /* ─── TOOL GRID ─── */
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 540px) { .tool-grid { grid-template-columns: 1fr; } }
  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13.5px;
  }
  .tool-card .tool-name { font-weight: 600; margin-bottom: 3px; }
  .tool-card .tool-desc { color: var(--muted); font-size: 12.5px; }

  /* ─── ESCALATION BADGE ─── */
  .escalate {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--danger-light);
    border: 1px solid #fecaca;
    color: #991b1b;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
  }

  /* ─── DIVIDER ─── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

  /* ─── FOOTER ─── */
  footer { text-align: center; font-size: 12.5px; color: var(--muted); padding-top: 24px; border-top: 1px solid var(--border); }
  footer strong { color: var(--text); }

  .content h1{font-size:28px;font-weight:700;letter-spacing:-0.03em;margin-bottom:12px}
  .content h2{font-size:19px;margin:36px 0 12px;padding-top:8px;border-top:1px solid var(--border)}
  .content h3{font-size:15px;margin:22px 0 8px;color:var(--accent-dark)}
  .content p,.content ul{margin-bottom:12px} .content ul{padding-left:22px}
  .content table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;margin:12px 0 20px;display:block;overflow-x:auto}
  .content th,.content td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  .content th{background:var(--accent-light);color:var(--accent-dark);font-weight:600}
  .content code{font-family:var(--mono);font-size:12px;background:#f0f0ec;padding:1px 5px;border-radius:4px}
  .content a{color:var(--accent-dark)}
  .page.wide{max-width:1100px}
</style></head>
<body><nav><a class="logo" href="{{ '/' | relative_url }}"><span class="logo-dot"></span>Ellison &amp; Fitz · Product Log</a><span class="nav-badge">Internal · sourcing</span></nav>
<div class="page{% if page.wide %} wide{% endif %}"><div class="content">{{ content }}</div></div></body></html>
